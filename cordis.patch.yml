# ============================================================================
# coopanion-connector-dsh —— DSH bundle patch
# ============================================================================
# 这是桥接的"挂载声明"。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件把 Host 侧桥接行插入 profile 的配置树。
#
# 安装：桌面端由宿主内置的 plugin_manager 完成（命令行按设计不碰 desktop profile）；
# web 端用 dsh plugin --profile web add link:<本目录绝对路径>，或按包名从 npm 装。
#
# 行名必须与 package.json 的 name 一致：DSH 按它解析到构建产物 dist/index.cjs。
# ============================================================================

- insert:
    - id: coopanion-connector-dsh
      name: coopanion-connector-dsh
